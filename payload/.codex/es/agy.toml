# This is this kit's configuration, NOT an Antigravity native settings file.
# Model availability is reported by AGY when invoked.
executable = "agy"
timeout_seconds = 1800
collection_max_steps = 24
explorer_model = "claude-sonnet-5-5-high"
reader_model = "claude-sonnet-5-5-high"
review_model_order = ["claude-opus-5-5-high", "gemini-3.1-pro-high", "gemini-3.8-flash-high"]
collection_model_order = ["claude-sonnet-5-5-high", "gemini-3.8-flash-high"]
subagent_model = "claude-opus-5-5-high"
